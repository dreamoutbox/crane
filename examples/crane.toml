# crane.toml

[[nodes]]
name = "vps1"
ssh_user = "root"
ssh_ip = "127.0.0.1"
ssh_port = 2221
public_ip = "10.0.0.11"
internal_ip = "10.0.0.11"
roles = ["app", "haproxy", "postgres", "redis"]
private_key = "dev-ssh-keys/id_ed25519"
sudo_pass = "${SUDO_PASS_VPS1}"
firewall_expose_port_range = ["2221", "80", "443", "3000-3100", "4000-4100"]

[[nodes]]
name = "vps2"
ssh_user = "root"
ssh_ip = "127.0.0.1"
ssh_port = 2222
public_ip = "10.0.0.12"
internal_ip = "10.0.0.12"
roles = ["app", "haproxy", "postgres", "redis"]
private_key = "dev-ssh-keys/id_ed25519"
sudo_pass = "${SUDO_PASS_VPS2}"
firewall_expose_port_range = ["2222", "80", "443", "3000-3100", "4000-4100"]

[[nodes]]
name = "vps3"
ssh_user = "root"
ssh_ip = "127.0.0.1"
ssh_port = 2223
public_ip = "10.0.0.13"
internal_ip = "10.0.0.13"
roles = ["app", "haproxy", "postgres", "redis"]
private_key = "dev-ssh-keys/id_ed25519"
sudo_pass = "${SUDO_PASS_VPS3}"
firewall_expose_port_range = ["2223", "80", "443", "3000-3100", "4000-4100"]

[[users]]
name = "deployman"
groups = ["www"]
ssh_authorized_keys = ["dev-ssh-keys/id_ed25519.pub"]
private_key = "dev-ssh-keys/id_ed25519"


[app.myapp]
name = "myapp"
# Setup Info
dependencies = ["libssl3", "ca-certificates"]
# Deploy Info
deploy_dir = "./examples"
entrypoint = "./myapp"
pre_deploy_script = "./startup.sh"
deploy_user = "deployman"
port_start = 3000
port_end = 3100
# Health Check
health_check_path = "/health"
health_check_timeout = 10
health_check_interval = 5
# Domain
domain = "myapp.localhost"
# Replicas
instances = 1
# ENV for myapp
[app.myapp.env]
APP_ENV = "production"
LOG_LEVEL = "debug"
APP_NAME = "myapp"
# Databases for myapp
[[app.myapp.database]]
databases = "mydb"
user = "u1"

[app.myapp2]
name = "myapp2"
# Setup Info
dependencies = ["libssl3", "ca-certificates"]
# Deploy Info
deploy_dir = "./examples"
entrypoint = "./myapp"
deploy_user = "deployman"
port_start = 4000
port_end = 4100
# Health Check
health_check_path = "/health"
health_check_timeout = 10
health_check_interval = 5
# Domain
domain = "myapp2.localhost"
# Replicas
instances = 2
# ENV for myapp2
[app.myapp2.env]
APP_ENV = "production"
LOG_LEVEL = "debug"
APP_NAME = "myapp2"
# Databases for myapp2
[[app.myapp2.database]]
databases = "mydb"
user = "u2"
[[app.myapp2.database]]
databases = "mydb"
user = "u1"


[db.postgres]
enabled = true
minimal = false
version = "18"
replica_pass = "replica"

[db.postgres.backup]
full_backup_every = "1h"
incremental_backup_every = "30m"

[db.postgres.mydb]
name = "mydb"

[[db.postgres.users]]
state = "present"
user = "u1"
password = "u1"
databases = ["mydb"]

[[db.postgres.users]]
state = "present"
user = "u2"
password = "u2"
databases = ["mydb"]


[backup.s3]
enabled = false
bucket = "crane1"
region = "us-east-1"
endpoint = "http://s3:9000"
access_key_id = "${S3_ACCESS_KEY_ID}"
secret_access_key = "${S3_SECRET_ACCESS_KEY}"


[domain]
enabled = false
provider = "cloudflare"
domain_name = "localhost"
token = "${CLOUDFLARE_TOKEN}"
